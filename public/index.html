<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MegaFile Upload</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-color: #f8fafc;
        }

        body {
            margin: 0;
            font-family: monospace, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { margin-top: 2rem; color: var(--accent); }

        /* Dev Console Overlay */
        #devHUD {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #333;
            padding: 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            color: #00ff66;
            max-width: 300px;
        }

        /* Easter Egg Matrix FX */
        .matrix-mode {
            --bg-color: #000000 !important;
            --accent: #00ff66 !important;
            --card-bg: #051a05 !important;
            --text-color: #00ff66 !important;
        }

        .radar-node {
            width: 120px;
            height: 120px;
            background: var(--card-bg);
            border: 2px dashed var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 3rem 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radar-node:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <h1>⚡ MegaFile Upload</h1>
    <p>P2P Encrypted File Tunnel</p>

    <div class="radar-node" onclick="triggerEasterEgg()" id="node">
        <span>Click Me 🚀</span>
    </div>

    <!-- Dev Tools HUD -->
    <div id="devHUD">
        <div><strong>🛠 Dev Tools</strong></div>
        <div>Socket Status: <span id="sockStatus">Connecting...</span></div>
        <div>Active Network Peers: <span id="peerCount">0</span></div>
        <div>WebRTC State: <span id="rtcState">Idle</span></div>
        <div style="margin-top:5px; color:#aaa;">Hint: Press <code>`</code> (tilde) to trigger Matrix mode.</div>
    </div>

    <script>
        const socket = io();
        let eggClicks = 0;

        socket.on('connect', () => {
            document.getElementById('sockStatus').innerText = "Connected 🟢";
        });

        socket.on('dev-stats', (data) => {
            document.getElementById('peerCount').innerText = data.peers;
        });

        // Easter Egg 1: Click Node 5 Times
        function triggerEasterEgg() {
            eggClicks++;
            if (eggClicks === 5) {
                alert("🎉 Dev Mode Unlocked! You found the hidden trigger.");
                document.body.classList.toggle('matrix-mode');
                eggClicks = 0;
            }
        }

        // Easter Egg 2: Press Tilde (`) Key for Matrix Mode
        window.addEventListener('keydown', (e) => {
            if (e.key === '`') {
                document.body.classList.toggle('matrix-mode');
                console.log("🕹️ Toggled Matrix Theme!");
            }
        });
    </script>
</body>
</html>
